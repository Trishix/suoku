services:
  api:
    # The API accepts authenticated requests but delegates all model work to worker.
    build:
      context: .
      target: api
    environment:
      SUOKU_API_TOKEN: ${SUOKU_API_TOKEN:?Set a random API token of at least 32 characters}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["suoku-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
  worker:
    # Offline by default: use compose.insights.yaml only after reviewing provider egress.
    build:
      context: .
      target: worker
    network_mode: none
    volumes: ["suoku-data:/data", "./.models:/models:ro"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped

volumes:
  suoku-data:
