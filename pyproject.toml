[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "suoku"
version = "0.1.0a2"
description = "Video evidence and structured insights for LLMs, with local search and bring-your-own-key analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
keywords = ["video", "computer-vision", "multimodal", "llm", "retrieval", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["lancedb>=0.25,<0.30", "numpy>=1.26,<3", "pillow>=11,<13", "filelock>=3.16,<4"]

[project.urls]
Homepage = "https://github.com/Trishix/suoku#readme"
Repository = "https://github.com/Trishix/suoku"
Issues = "https://github.com/Trishix/suoku/issues"
Documentation = "https://github.com/Trishix/suoku#readme"

[project.optional-dependencies]
# Keep local embeddings, the service, and BYOK insights independently installable.
local = ["transformers>=4.49,<5", "torch>=2.6,<3", "safetensors>=0.5,<1", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jsonschema>=4.23,<5"]
insights = ["litellm==1.102.0", "jsonschema>=4.23,<5"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11", "build>=1.2", "jsonschema>=4.23,<5"]

[project.scripts]
suoku = "suoku.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/suoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
