name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    # Exercise supported interpreter families while keeping paid provider calls opt-in.
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-14
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install decoder
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else brew install ffmpeg; fi
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[server,dev,insights]'
      - run: .venv/bin/python -m ruff check src tests scripts examples
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/export_openapi.py
      - run: npm ci --prefix packages/client
      - run: npm run generate --prefix packages/client
      - run: git diff --exit-code -- schema/openapi.json packages/client/src/schema.ts
      - run: npm test --prefix packages/client
      - run: .venv/bin/python -m build
      - run: npm pack --dry-run
        working-directory: packages/client
      - name: Install built Python wheel into a clean environment
        run: |
          python -m venv /tmp/suoku-wheel
          /tmp/suoku-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/suoku-wheel/bin/python -c 'from suoku import VideoLake; print(VideoLake.__name__)'
          /tmp/suoku-wheel/bin/suoku --help
      - name: Validate container profiles
        if: runner.os == 'Linux'
        env:
          SUOKU_API_TOKEN: ci-placeholder-token-not-for-deployment-0000
          SUOKU_INSIGHT_MODEL: openai/test-model
          SUOKU_PROVIDER_API_KEY: ci-placeholder-key-not-for-deployment
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.insights.yaml config --quiet
