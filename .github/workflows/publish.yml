name: Publish Python package

on:
  release:
    types: [published]

# PyPI Trusted Publishing uses GitHub's short-lived OIDC identity. No PyPI token
# or password is stored in repository secrets.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      # This action exchanges the OIDC identity for a short-lived PyPI credential.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
